<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Eventos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card class="welcome-card">
    <ion-card-header>
      <ion-card-subtitle>Eventos</ion-card-subtitle>
      <ion-card-title>Bienvenid@s a Eventos</ion-card-title>
    </ion-card-header>

  <ion-card-content>
    <p>Consulte a continuacion el listado de eventos</p>
  </ion-card-content>

  </ion-card>

  <ion-list lines ="none">
    <ion-list-header>
      <ion-label>Lista de Eventos</ion-label>
    </ion-list-header>

    @for(item of eventos; track item.id)
    {
      <ion-item>
        <ion-label>{{ item.speaker }}</ion-label>
        <ion-label>{{ item.title }}</ion-label>
      </ion-item>
    }
  </ion-list>

</ion-content>
